name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ml-service:
    name: ML service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_service/requirements.txt
      - name: Install ML service and test dependencies
        run: python -m pip install -r ml_service/requirements.txt pytest httpx
      - name: Run ML service tests
        working-directory: ml_service
        run: PYTHONPATH=. pytest -q

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required token and Compose syntax
        run: |
          export ML_INTERNAL_TOKEN="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 64)"
          docker compose config --quiet

  full-stack-integration:
    name: Full-stack integration and persistence
    runs-on: ubuntu-latest
    needs: [ml-service, backend, frontend, compose-config]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install integration runner dependencies
        working-directory: backend
        run: npm ci
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "ML_INTERNAL_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 64)" >> "$GITHUB_ENV"
          echo "DEMO_MODE=false" >> "$GITHUB_ENV"
      - name: Build and wait for all Compose services
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Run full upload-to-review integration test
        env:
          MONGODB_URI: mongodb://localhost:27017/brandguard
        run: node integration_test.js
      - name: Restart ML service and wait for health
        shell: bash
        run: |
          docker compose restart ml
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "ML service healthy after restart."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color ml
          echo "ML service did not recover after restart." >&2
          exit 1
      - name: Verify indexed document survived ML restart
        env:
          MONGODB_URI: mongodb://localhost:27017/brandguard
        run: node scripts/verify-ml-persistence.js
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-integration.log || true
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-logs
          path: compose-integration.log
          if-no-files-found: ignore
      - name: Stop Compose stack
        if: always()
        run: docker compose down
