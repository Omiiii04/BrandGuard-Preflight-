name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ml-service:
    name: ML service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_service/requirements.txt
      - name: Install ML service and test dependencies
        run: python -m pip install -r ml_service/requirements.txt pytest httpx
      - name: Run ML service tests
        working-directory: ml_service
        run: PYTHONPATH=. pytest -q

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required token and Compose syntax
        run: |
          export ML_INTERNAL_TOKEN="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 64)"
          docker compose config --quiet

  full-stack-integration:
    name: Full-stack integration and persistence
    runs-on: ubuntu-latest
    needs: [ml-service, backend, frontend, compose-config]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install integration runner dependencies
        working-directory: backend
        run: npm ci
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "ML_INTERNAL_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 64)" >> "$GITHUB_ENV"
          echo "DEMO_MODE=false" >> "$GITHUB_ENV"
      - name: Build and wait for all Compose services
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Run full upload-to-review integration test
        env:
          MONGODB_URI: mongodb://localhost:27017/brandguard
        run: node integration_test.js
      - name: Restart ML service and wait for health
        shell: bash
        run: |
          docker compose restart ml
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "ML service healthy after restart."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color ml
          echo "ML service did not recover after restart." >&2
          exit 1
      - name: Verify indexed document survived ML restart
        env:
          MONGODB_URI: mongodb://localhost:27017/brandguard
        run: node scripts/verify-ml-persistence.js
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-integration.log || true
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-logs
          path: compose-integration.log
          if-no-files-found: ignore
      - name: Stop Compose stack
        if: always()
        run: docker compose down

  windows-environment-setup:
    name: Windows PowerShell environment setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check local verification scripts parse cleanly
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/verify-local.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          node --check integration_test.js
          if ($LASTEXITCODE -ne 0) { throw 'integration_test.js has a syntax error.' }
          node --check scripts/verify-ml-persistence.js
          if ($LASTEXITCODE -ne 0) { throw 'verify-ml-persistence.js has a syntax error.' }
      - name: Generate local secrets safely and verify idempotence
        shell: pwsh
        run: |
          & .\scripts\setup-env.ps1
          $lines = Get-Content .env
          $mlLine = $lines | Where-Object { $_ -match '^ML_INTERNAL_TOKEN=' } | Select-Object -Last 1
          $jwtLine = $lines | Where-Object { $_ -match '^JWT_SECRET=' } | Select-Object -Last 1
          if (-not $mlLine -or -not $jwtLine) { throw 'Required environment keys are missing.' }
          $mlToken = ($mlLine -split '=', 2)[1]
          $jwtSecret = ($jwtLine -split '=', 2)[1]
          if ($mlToken.Length -lt 64) { throw 'ML_INTERNAL_TOKEN is not strong enough.' }
          if ($jwtSecret.Length -lt 128) { throw 'JWT_SECRET is not strong enough.' }
          if (-not (git check-ignore .env)) { throw '.env must be ignored by git.' }
          $output = (& .\scripts\setup-env.ps1 2>&1 | Out-String)
          if ($output.Contains($mlToken) -or $output.Contains($jwtSecret)) { throw 'The setup helper printed a secret value.' }
          $after = Get-Content .env
          $mlAfter = (($after | Where-Object { $_ -match '^ML_INTERNAL_TOKEN=' } | Select-Object -Last 1) -split '=', 2)[1]
          $jwtAfter = (($after | Where-Object { $_ -match '^JWT_SECRET=' } | Select-Object -Last 1) -split '=', 2)[1]
          if ($mlAfter -ne $mlToken -or $jwtAfter -ne $jwtSecret) { throw 'The setup helper rotated an existing strong secret unexpectedly.' }
          Write-Host 'PASS: secrets are strong, kept out of output, preserved on rerun, and .env is git-ignored.'
